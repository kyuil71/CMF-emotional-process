      /* 꽃 제한 — 감성 키워드나 연관 과제가 꽃과 직접 연결될 때만 꽃 장면을 허용합니다. */
      const FLOWER_RE = /꽃|플라워|장미|벚꽃|튤립|라벤더|국화|수국|목련|개나리|진달래|해바라기|부케|flower|floral|blossom|bloom|petal|bouquet|tulip|lavender/i;
      function flowerAllowed(keyword, note) { return FLOWER_RE.test(`${keyword || ""} ${note || ""}`); }
      function flowerRuleKo(keyword, note) {
        return flowerAllowed(keyword, note)

/* 감성 해석의 내부 시각 기준(cues)을 이후 단계 프롬프트에 이어 붙입니다. 사용자 화면에는 나오지 않습니다. */
      function cuesBlock(c) {
        if (!c || !c.cues) return "";
        const multi = c.multi ? "\n[여러 감성 해석 통합]\n- 여러 감성 해석이 함께 선택되었습니다. 공통점을 중심으로 통합하되 각 해석의 특징이 결과에 고루 반영되게 합니다.\n" : "";
        return multi + `\n[처음 감성 키워드에서 사람들이 자연스럽게 떠올리는 시각 특성 — 내부 기준]\n${c.cues}\n- 이 특성이 이 단계 결과와 이미지에도 분명하게(조금 과장될 정도로) 이어지게 합니다. 단, 이 기준 문장이나 '키워드=특성' 형식의 설명을 결과 문장에 그대로 쓰지 않습니다.\n`;
      }
      function cuesImgLine() {
        const c = selectedConcept();
        return c && c.cues ? `\nCarry the perceptual qualities people associate with the original emotion keyword, slightly exaggerated, through colour, light and energy: ${c.cues}` : "";
      }

      const STYLE_RULE_TEXT = `입력 감성의 특성에 따라 위 8개 표현 방식 중 가장 적합한 하나를 직접 고릅니다. 감성의 의미뿐 아니라 에너지, 긴장도, 공간감, 시간성, 자연성, 추상성을 함께 고려해 결정합니다. 같은 스타일을 기계적으로 반복하지 말고, 입력된 감성을 가장 명확하게 전달하는 표현 방식을 고릅니다.`;

      const LABEL_LANGS = [
        { id: "en", label: "영문만" },
        { id: "ko", label: "한글 + 영문" }

      const QUALITIES = [
        { id: "medium", label: "표준" },

      /* 감성 해석 방식 — 사용자 선택 없이 한 가지 방법론으로 고정합니다. */
      const EMOTION_METHOD = {
        label: "지각·경험 중심 감성디자인",

        guide: `입력 감성을 색·소재·형태로 바로 번역하지 않습니다. 먼저 사람이 그 감성을 몸과 마음으로 어떻게 경험하는지 해석합니다. 감성의 에너지, 긴장과 이완, 안정감, 활동성, 움직임과 리듬, 시간감, 공간 분위기, 정서적 온도, 자극에 대한 반응, 감정의 여운을 함께 봅니다. 감성을 문자 그대로 묘사하는 대신, 그 감정을 실제로 체험하는 듯 느끼게 하는 하나의 정서적 은유 장면으로 표현합니다.`
      };

      const STAGES = [
        { n: 1, label: "감성 키워드" },
        { n: 2, label: "감성 해석" },
        { n: 3, label: "지각 특성" },
        { n: 4, label: "물성 정의" },
        { n: 5, label: "CMF 제안" }
      ];

      const SAMPLE_KEYWORDS = [
        "차갑고 아름답고 무거움",
        "밝고 아름답다",
        "젊고 활기차고 아름답다",

      /* =========================================================
         2. PROMPTS — 텍스트
         ========================================================= */
      /* 한글 이름·제목 작성 규칙 — 어려운 한자어 조합 대신 쉽게 읽히는 말로 씁니다. */
      const NAMING_RULE = `[한글 이름·제목 작성 규칙 — 모든 단계에 적용]
- 콘셉트명, 지각 특성명, 물성명, CMF 안 이름 같은 한글 이름과 제목은 처음 보는 사람도 바로 뜻을 알 수 있는 쉬운 말로 짓습니다.
- 한자어 명사를 여러 개 붙여 만든 압축형 이름을 쓰지 않습니다. 예: '심층 흑청 강재', '냉광 기념비 도자', '층위형 광학 심도', '경계부 연화성'.
- 대신 일상적인 우리말과 디자이너가 흔히 쓰는 외래어(스틸, 세라믹, 글라스, 매트, 글로시, 블루 등)를 섞어 이미지가 떠오르게 풀어 씁니다.
  좋은 예: 심층 흑청 강재 → 심해의 다크블루 스틸 / 냉광 기념비 도자 → 차가운 기념비 같은 세라믹 / 층위형 광학 심도 → 겹겹이 깊어지는 빛 / 경계부 연화성 → 부드럽게 풀리는 가장자리.
- 설명 문장도 같은 원칙으로, 꼭 필요한 전문 용어가 아니면 어려운 한자어보다 쉬운 표현을 고릅니다.`;

      const SYSTEM = `당신은 감성 디자인, 지각심리학, 물성 공학, CMF(Color·Material·Finish)를 함께 다루는 시니어 CMF 디자이너입니다.
- 모든 한국어 문장은 정중하고 명확한 존댓말로 작성합니다.
- 감성 단계에서는 사람이 실제로 느끼는 정서와 몸·마음의 반응을 자연스럽고 구체적인 경험 언어로 표현합니다.

${NAMING_RULE}`;

      const PROMPTS = {
        EMOTION: (keyword, note, instruction) => `감성 키워드: "${keyword}"
${note ? `사용자가 입력한 연관 과제(참고용 맥락): ${note}
[연관 과제 사용 규칙 — 반드시 지킴]

- 감성 해석 이미지는 제품 이전의 순수한 감성 장면이어야 합니다. 감성은 자연, 공간, 빛, 물질 현상, 사람의 행동 등 연관 과제와 무관한 장면으로 표현합니다.

[공통 지각 특성 매칭 — 가장 먼저 적용, 내부 기준]
- 감성 키워드를 단어 단위로 나누고, 일반적인 사람들이 각 단어에서 자연스럽게 떠올리는 시각·감각 특성을 먼저 찾습니다.
- 참고 예(형식만 참고하고 입력 단어에 맞게 판단): 젊다 → 높은 채도와 선명한 원색 대비 / 활기차다 → 역동적인 움직임, 공중에 뜬 순간, 사선 구도 / 아름답다 → 맑고 밝은 빛, 균형 잡힌 조화 / 차갑다 → 청회색 계열과 서늘한 빛 / 무겁다 → 큰 질량, 낮은 시점, 짙은 그림자 / 귀엽다 → 둥근 형태, 파스텔 톤 / 고요하다 → 넓은 여백, 낮은 대비, 정지된 수평.
- 찾은 특성은 세 안 모두의 장면 선택, 색, 빛, 움직임, 구도에 '조금 과장될 정도로' 분명하게 반영합니다. 보는 사람이 이미지를 보자마자 키워드를 떠올릴 수 있어야 합니다.
- 키워드에 여러 단어가 있으면 한 단어만 살리지 말고 모든 단어의 특성이 한 장면 안에서 함께 느껴지게 합니다.
- 단, 이 매칭 자체(예: '젊다는 채도가 높다', '활기차다는 역동적이다')를 definition, experience, subject, moodWords, 제목 등 사용자에게 보이는 어떤 문장에도 쓰지 않습니다. 설명하지 말고 결과로 느껴지게만 합니다.
- "cues"에는 이 매칭을 반영해 이미지에서 강조할 시각 특성을 영어 한 문장으로 적습니다. 이 값은 내부용이며 화면에 표시되지 않습니다. 예: "vivid saturated primary colours, mid-air dynamic moment with diagonal energy, bright clear sunlight".

[목표]
하나의 감성 키워드를 같은 감성 패밀리 안에서 서로 다른 3개의 지각·경험으로 해석하고, 사용자가 그중 하나를 고를 수 있게 합니다.
세 안은 서로 달라야 하지만 완전히 동떨어져서는 안 됩니다. 사용자가 보았을 때 “같은 감성을 이렇게 세 가지 방식으로 느낄 수 있구나”라고 이해되어야 합니다.

[3개 해석의 기본 초점]
- 1안: Energy & Motion — 에너지 수준, 반응 속도, 움직임, 리듬, 생동감을 중심으로 해석합니다.
- 2안: Atmosphere & Space — 공간 분위기, 빛, 거리감, 개방감·포근함·긴장감 등 환경적으로 느껴지는 상태를 중심으로 해석합니다.
- 3안: Sensation & Afterglow — 촉각적으로 연상되는 느낌, 정서적 온도, 몸의 반응, 감정이 남는 방식과 여운을 중심으로 해석합니다.

[감성 정의 규칙]

- "definition"은 3~4문장으로 씁니다. 유사어를 나열하지 말고 사람이 실제로 느끼는 정서 상태와 몸·마음의 변화를 자연스럽게 설명합니다.
- 에너지 수준, 긴장과 이완, 안정감, 활동성, 시간적 느낌, 공간 분위기, 감정의 온도, 반응성, 여운 중 해당 감성에 중요한 요소를 포함합니다.

- 광택, 거칠기, 투명도, 금속성, 경도, 소재명, 가공법 등 물성·CMF 언어는 이 단계에서 사용하지 않습니다.
- "moodWords"는 해당 해석을 요약하는 한국어 감성 단어 4개입니다.
- "experience"는 이미지 아래에 붙일 1~2문장의 체감 설명입니다. 이미지에 보이는 사물을 설명하지 말고, 그 장면에서 사람이 어떻게 반응하고 어떤 여운을 느끼는지 적습니다.

[대표 장면과 정서적 은유]

- 3개의 멋있는 제목만 만들고 실제 경험 설명을 약하게 하지 않습니다.
- 건축 + 동물 + 풍경처럼 unrelated한 이미지를 한 안에 조합하지 않습니다.

- 감성에서 바로 색상·소재·가공기법을 제안하지 않습니다.

[핵심 관점]

[출력 수량]
- 핵심 지각 특성은 반드시 정확히 10개만 생성합니다.

[지각 축 선정 원칙]
다음 풀을 참고하되 입력 감성에 가장 적합한 10개를 직접 고릅니다. 아래 항목을 기계적으로 모두 사용하지 않습니다.
감지 속도, 첫인상 선명도, 표면 반응감, 저항감, 회복감, 확산감, 리듬감, 깊이감, 온도 인상, 밀도감, 공간 점유감, 안착감, 잔향감, 방향성, 경계감, 거리감, 균형감, 압력감, 변화 감지, 움직임 연속성.

가능하면 10개 지각이 다음의 서로 다른 경험 역할을 고르게 포괄하도록 구성합니다.
1) 초기 인식 — 처음 보거나 닿는 순간 어떻게 알아차려지는가
2) 접촉·반응 — 자극이나 터치에 어떤 반응처럼 느껴지는가
3) 공간·전개 — 시선·빛·감각이 어떻게 퍼지고 깊어지고 모이는가
4) 시간·움직임 — 변화, 리듬, 회복, 지속이 어떻게 경험되는가
5) 잔향·안착 — 경험이 끝난 뒤 어떤 안정감이나 여운으로 남는가
단, 감성에 더 적절한 축이 있으면 위 역할을 유연하게 대체합니다.

[작성 규칙]

- "titleKo"를 "싱그러운 잔광", "맑은 온기", "부드러운 회복"처럼 시적인 명사구로 쓰지 않습니다.
- "titleEn"은 같은 지각을 간결하게 표현하는 자연스러운 영어 문구입니다.

- 각 지각 특성은 다음 단계의 물성 축으로 연결 가능해야 합니다. 그러나 이 단계에서는 Gloss, Roughness, Transparency, Elasticity, Hardness, Reflectivity 등의 물성명, 소재명, 가공법명을 직접 쓰지 않습니다.

          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")

      const nowLabel = t => new Date(t).toLocaleString("ko-KR", {

      function toast(msg, kind) {
        const region = document.getElementById("toast-region");

      /* =========================================================
         5. 저장소 — 프로젝트 텍스트는 localStorage, 이미지는 IndexedDB
         이미지는 base64라 용량이 커서 localStorage에 넣으면 곧 넘칩니다.
         ========================================================= */
      /* 프로젝트와 이미지를 모두 IndexedDB에 저장합니다.
         - localStorage는 브라우저가 디스크 기록을 미루거나(쓰기량 제한) 다른 로컬 HTML 파일과 용량을 나눠 써서
           앱을 강제 종료하거나 다시 열었을 때 마지막 수정이 빠지는 문제가 있었습니다.
         - IndexedDB 쓰기는 트랜잭션이 디스크에 확정(complete)된 뒤에만 완료로 처리합니다. */
      const IMAGE_SLOTS = ["emotion", "perception", "property", "material"];
      const PROJECT_STORE = "projects";
      let imageDbPromise = null;

      const IDB = {
        open() {
          if (!("indexedDB" in window)) return Promise.reject(new Error("IDB_UNAVAILABLE"));
          if (imageDbPromise) return imageDbPromise;
          imageDbPromise = new Promise((res, rej) => {
            const req = indexedDB.open(CONFIG.IMAGE_DB.name, 2);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains(CONFIG.IMAGE_DB.store)) db.createObjectStore(CONFIG.IMAGE_DB.store, { keyPath: "id" });
              if (!db.objectStoreNames.contains(PROJECT_STORE)) db.createObjectStore(PROJECT_STORE, { keyPath: "id" });
            };
            req.onsuccess = () => {
              const db = req.result;
              db.onversionchange = () => { try { db.close(); } catch (e) { /* 무시 */ } imageDbPromise = null; };
              res(db);
            };
            req.onerror = () => rej(req.error || new Error("IDB_OPEN_FAILED"));
            req.onblocked = () => toast("이전 버전 프로그램이 다른 탭이나 창에 열려 있습니다. 그 창을 닫으면 저장 기능이 이어집니다.", "error");
          }).catch(err => { imageDbPromise = null; throw err; });
          return imageDbPromise;
        },
        /* 쓰기 트랜잭션은 oncomplete(디스크 확정)에서 완료로 처리합니다. */
        act(storeName, mode, fn) {
          return IDB.open().then(db => new Promise((res, rej) => {
            let tx;
            try { tx = db.transaction(storeName, mode, mode === "readwrite" ? { durability: "strict" } : undefined); }
            catch (e) { tx = db.transaction(storeName, mode); }
            let result;
            const rq = fn(tx.objectStore(storeName));
            if (rq) rq.onsuccess = () => { result = rq.result; };
            tx.oncomplete = () => res(result);
            tx.onerror = () => rej(tx.error || new Error("IDB_TX_FAILED"));
            tx.onabort = () => rej(tx.error || new Error("IDB_TX_ABORTED"));
          }));
        }
      };

      const Store = {
        cache: [],
        sigs: {},
        useLS: false,
        chain: Promise.resolve(),
        _readLS() {
          try {
            const raw = localStorage.getItem(CONFIG.PROJECTS_KEY);
            const list = raw ? JSON.parse(raw) : [];
            return Array.isArray(list) ? list : [];
          } catch (e) { return []; }
        },
        _writeLS(list) {
          try { localStorage.setItem(CONFIG.PROJECTS_KEY, JSON.stringify(list)); return true; }
          catch (e) { return false; }
        },
        _sig(row) { return JSON.stringify([row.title, row.data]); },
        /* 부팅 시 한 번: IndexedDB에서 목록을 읽고, 예전 버전이 localStorage에 남긴 프로젝트를 옮겨 옵니다. */
        async init() {
          let rows = [];
          try {
            rows = (await IDB.act(PROJECT_STORE, "readonly", st => st.getAll())) || [];
          } catch (e) {
            console.warn("IndexedDB를 쓸 수 없어 localStorage로 저장합니다.", e);
            Store.useLS = true;
          }
          const legacy = Store._readLS();
          if (Store.useLS) {
            rows = legacy;
          } else if (legacy.length) {
            try {
              const moved = legacy.filter(p => p && p.id && !rows.some(r => r.id === p.id && (r.savedAt || 0) >= (p.savedAt || 0)));
              if (moved.length) await IDB.act(PROJECT_STORE, "readwrite", st => { moved.forEach(p => st.put(p)); });
              rows = rows.filter(r => !moved.some(p => p.id === r.id)).concat(moved);
              localStorage.removeItem(CONFIG.PROJECTS_KEY);
            } catch (e) { console.warn("기존 프로젝트 이전 실패", e); }
          }
          rows = rows.filter(r => r && r.id && r.data).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
          rows.slice(CONFIG.MAX_PROJECTS).forEach(p => Store._dropDisk(p.id));
          Store.cache = rows.slice(0, CONFIG.MAX_PROJECTS);
          Store.cache.forEach(r => { Store.sigs[r.id] = Store._sig(r); });
          try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* 무시 */ }
        },
        list() { return Store.cache.slice(); },
        /* 디스크 쓰기는 순서대로 한 개씩 처리합니다. 마지막 쓰기가 항상 마지막 상태가 됩니다. */
        _queue(job) {
          const p = Store.chain.then(job);
          Store.chain = p.catch(() => {});
          return p;
        },
        _writeRow(row) {
          if (Store.useLS) return Promise.resolve(Store._writeLS(Store.cache)).then(ok => { if (!ok) throw new Error("QUOTA"); });
          return IDB.act(PROJECT_STORE, "readwrite", st => st.put(row));
        },
        _dropDisk(id) {
          ImageDB.removeProject(id);
          if (Store.useLS) return Store._queue(() => Store._writeLS(Store.cache));
          return Store._queue(() => IDB.act(PROJECT_STORE, "readwrite", st => st.delete(id))).catch(() => {});
        },
        /* 내용이 바뀌었을 때만 저장합니다. 반환: Promise<"ok"|"same"|"fail"> */
        save(snapshot, meta) {
          const row = { id: meta.id, title: meta.title, savedAt: Date.now(), data: JSON.parse(JSON.stringify(snapshot)) };
          const sig = Store._sig(row);
          if (Store.sigs[meta.id] === sig && Store.cache.some(p => p.id === meta.id)) return Promise.resolve("same");
          Store.sigs[meta.id] = sig;
          let list = Store.cache.filter(p => p.id !== meta.id);
          list.unshift(row);
          const dropped = list.slice(CONFIG.MAX_PROJECTS);
          Store.cache = list.slice(0, CONFIG.MAX_PROJECTS);
          dropped.forEach(p => { delete Store.sigs[p.id]; Store._dropDisk(p.id); });
          return Store._queue(() => Store._writeRow(row)).then(() => "ok").catch(err => {
            console.warn("프로젝트 저장 실패", err);
            delete Store.sigs[meta.id];
            return "fail";
          });
        },
        remove(id) {
          Store.cache = Store.cache.filter(p => p.id !== id);
          delete Store.sigs[id];
          return Store._dropDisk(id);
        },
        flush() { return Store.chain; }
      };

      const ImageDB = {
        _act(mode, fn) { return IDB.act(CONFIG.IMAGE_DB.store, mode, fn); },
        key: (projectId, slot) => `${projectId}::${slot}`,
        async put(projectId, slot, dataUrl) {

        async get(projectId, slot) {

          } catch (e) { return null; }
        },
        async loadAll(projectId) {

        },
        async remove(projectId, slot) {

        async removeSlots(projectId, slots) {

        removeProject(projectId) {
          ImageDB._act("readwrite", st => { IMAGE_SLOTS.forEach(slot => st.delete(ImageDB.key(projectId, slot))); }).catch(() => {});
        }
      };

      /* =========================================================
         8. OpenAI 호출 — GPT-5.6 Terra / Image 2.5 Flare 고정
         파라미터 호환성 차이가 있을 때만 요청 옵션을 단계적으로 줄여 재시도합니다.
         ========================================================= */
      let activeController = null;

      /* 응답이 길이 한도에서 잘렸을 때, 배열 안에서 끝까지 완성된 항목만 꺼냅니다. */
      function salvageArray(text) {
        const t = String(text || "");
        const m = /"([A-Za-z]+)"\s*:\s*\[/.exec(t);
        if (!m) return null;
        const items = [];
        let i = m.index + m[0].length, depth = 0, start = -1, inStr = false, escp = false;
        for (; i < t.length; i++) {
          const ch = t[i];
          if (inStr) { if (escp) escp = false; else if (ch === "\\") escp = true; else if (ch === '"') inStr = false; continue; }
          if (ch === '"') { inStr = true; continue; }
          if (ch === "{") { if (depth === 0) start = i; depth++; }
          else if (ch === "}") { depth--; if (depth === 0 && start >= 0) { try { items.push(JSON.parse(t.slice(start, i + 1))); } catch (e) { /* 건너뜀 */ } start = -1; } }
          else if (ch === "]" && depth === 0) break;
        }
        return items.length ? { [m[1]]: items } : null;
      }

      function parseModelJson(text) {
        let t = String(text || "").trim();
        t = t.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
        try { return JSON.parse(t); } catch (e) { /* 구간 추출 재시도 */ }
        const starts = [t.indexOf("{"), t.indexOf("[")].filter(i => i >= 0);
        const first = starts.length ? Math.min.apply(null, starts) : -1;
        const last = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
        if (first >= 0 && last > first) {
          try { return JSON.parse(t.slice(first, last + 1)); } catch (e) { /* fallthrough */ }
        }
        const saved = salvageArray(t);
        if (saved) return saved;
        throw new Error("AI 응답을 JSON으로 해석하지 못했습니다. 다시 시도해 주세요.");
      }

      function extractOutputText(data) {
        if (data && typeof data.output_text === "string" && data.output_text.trim()) return data.output_text;
        const out = (data && Array.isArray(data.output)) ? data.output : [];
        const parts = [];
        out.forEach(item => {
          if (item && Array.isArray(item.content)) {
            item.content.forEach(c => {
              if (c && typeof c.text === "string" && (c.type === "output_text" || c.type === "text")) parts.push(c.text);
            });
          }
        });
        return parts.join("\n");
      }

      function httpMessage(status, payload) {
        const detail = payload && payload.error && payload.error.message ? payload.error.message : "";
        if (status === 401 || status === 403) return "API 키가 유효하지 않거나 권한이 없습니다. 키를 다시 확인해 주세요.";
        if (status === 404) return `고정 모델을 찾을 수 없습니다. API 계정에서 GPT-5.6 Terra와 Image 2.5 Flare 사용 권한을 확인해 주세요.${detail ? " (" + detail + ")" : ""}`;
        if (status === 429) return "요청이 너무 많거나 사용 한도에 도달했습니다. 잠시 후 다시 시도해 주세요.";
        if (status === 400) return detail || "요청 형식이 거부되었습니다.";
        return `요청이 거부되었습니다 (상태 ${status}).${detail ? " " + detail : ""}`;
      }

      async function postJson(path, body, controller) {
        const res = await fetch(CONFIG.API_BASE + path, {
          method: "POST",
          signal: controller.signal,
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${state.apiKey || ""}`
          },
          body: JSON.stringify(body)
        });
        let payload = null;
        try { payload = await res.json(); } catch (e) { payload = null; }
        if (!res.ok) {
          const err = new Error(httpMessage(res.status, payload));
          err.status = res.status;
          err.fatal = [401, 403].includes(res.status);
          err.paramIssue = res.status === 400 || res.status === 404;
          throw err;
        }
        return payload;
      }

      /* 텍스트 분석 — Responses API. 모델별 파라미터 지원 차이를 흡수합니다. */
      async function callText(systemPrompt, userPrompt) {
        const controller = new AbortController();
        activeController = controller;

        const input = [
          { role: "system", content: systemPrompt },
          { role: "user", content: userPrompt }
        ];
        const variants = [
          { model: FIXED_TEXT_MODEL, input, text: { format: { type: "json_object" } }, max_output_tokens: 32000, reasoning: { effort: "low" } },
          { model: FIXED_TEXT_MODEL, input, text: { format: { type: "json_object" } }, max_output_tokens: 32000 },
          { model: FIXED_TEXT_MODEL, input, text: { format: { type: "json_object" } } },
          { model: FIXED_TEXT_MODEL, input }
        ];

        const delays = [900, 2200, 5000];
        let lastError = "알 수 없는 오류가 발생했습니다.";
        let vi = 0;
        let attempt = 0;

        while (vi < variants.length) {
          try {
            const data = await postJson("/responses", variants[vi], controller);
            const text = extractOutputText(data);
            if (data && data.status === "incomplete") {
              /* 잘린 응답이라도 완성된 항목은 살리고, 모자란 개수는 fillToCount가 이어서 채웁니다. */
              const saved = salvageArray(text);
              if (saved) { console.warn("응답이 길이 한도에서 잘려 완성된 항목만 사용합니다.", saved); return saved; }
              throw new Error("응답이 최대 길이에 도달해 잘렸습니다. 다시 시도해 주세요.");
            }
            if (!text.trim()) throw new Error("AI가 빈 응답을 반환했습니다. 다시 시도해 주세요.");
            return parseModelJson(text);
          } catch (err) {
            if (err.name === "AbortError") { const e = new Error("__aborted__"); e.aborted = true; throw e; }
            lastError = err.message;
            if (err.fatal) break;
            if (err.paramIssue) { vi += 1; attempt = 0; continue; }
            if (attempt >= delays.length) break;
            await new Promise(r => setTimeout(r, delays[attempt]));
            attempt += 1;
          }
        }
        throw new Error(lastError);
      }

      /* 이미지 생성 — Images API. 통합 이미지 한 장만 생성합니다. */
      async function callImage(prompt) {
        const controller = new AbortController();
        activeController = controller;

        const variants = [
          { model: FIXED_IMAGE_MODEL, prompt, size: CONFIG.IMAGE_SIZE, quality: state.quality },
          { model: FIXED_IMAGE_MODEL, prompt, size: CONFIG.IMAGE_SIZE },
          { model: FIXED_IMAGE_MODEL, prompt }
        ];
        const delays = [1200, 3000];
        let lastError = "이미지를 생성하지 못했습니다.";
        let vi = 0;
        let attempt = 0;

        while (vi < variants.length) {
          try {
            const data = await postJson("/images/generations", variants[vi], controller);
            const first = data && Array.isArray(data.data) ? data.data[0] : null;
            if (first && first.b64_json) return `data:image/png;base64,${first.b64_json}`;
            if (first && first.url) return first.url;
            throw new Error("이미지 응답이 비어 있습니다. 다시 시도해 주세요.");
          } catch (err) {
            if (err.name === "AbortError") { const e = new Error("__aborted__"); e.aborted = true; throw e; }
            lastError = err.message;
            if (err.fatal) break;
            if (err.paramIssue) { vi += 1; attempt = 0; continue; }
            if (attempt >= delays.length) break;
            await new Promise(r => setTimeout(r, delays[attempt]));
            attempt += 1;
          }
        }
        throw new Error(lastError);
      }

      /* AI가 요청한 개수보다 적게 보냈을 때, 이미 받은 항목과 겹치지 않게 모자란 만큼 더 받아 채웁니다. */
      async function fillToCount(opts) {
        let items = opts.items.slice();
        for (let round = 0; round < 3 && items.length < opts.target; round++) {
          const need = opts.target - items.length;
          setState({ loadingMsg: `${opts.label}이 ${items.length}개만 와서 ${need}개를 더 만들고 있습니다` });
          const note = `[추가 생성 — 이 규칙이 앞의 개수 규칙보다 우선합니다]
이미 만든 ${items.length}개입니다: ${items.map((it, i) => `${pad2(i + 1)}. ${opts.titleOf(it)}`).join(" / ")}
이것들과 겹치지 않는 새 항목을 정확히 ${need}개 만들어 "${opts.key}" 배열에 넣습니다. 이미 만든 항목은 다시 넣지 않습니다.`;
          let data = null;
          try { data = await callText(SYSTEM, opts.prompt(note)); }
          catch (e) { if (e && e.aborted) throw e; console.warn("추가 생성 실패", e); break; }
          const extra = opts.norm(data).filter(x => !items.some(y => opts.titleOf(y) === opts.titleOf(x)));
          items = items.concat(extra).slice(0, opts.target);
        }
        items.forEach((it, i) => { it.index = i + 1; });
        if (items.length < opts.target) toast(`${opts.label}을 ${items.length}개만 받았습니다. '수정 지시'의 전체 다시 생성을 눌러 주세요.`, "error");
        return items;
      }
      const joinIns = (a, b) => [a, b].filter(Boolean).join("\n");

      async function withLoading(msg, fn) {
        setState({ isAnalyzing: true, loadingMsg: msg, errorMsg: null });
        try {
          const out = await fn();
          setState({ isAnalyzing: false });
          return out;
        } catch (err) {
          if (err && err.aborted) { setState({ isAnalyzing: false }); toast("작업을 취소했습니다."); return null; }
          console.error(err);
          setState({ isAnalyzing: false, errorMsg: err.message || "처리에 실패했습니다." });
          return null;
        } finally {
          activeController = null;
        }
      }

      /* =========================================================
         9. 응답 정규화 — 필드가 빠져도 화면이 죽지 않도록 방어
         ========================================================= */
      const str = v => (typeof v === "string" ? v.trim() : (v === null || v === undefined ? "" : String(v)));
      const arr = v => (Array.isArray(v) ? v : []);

      /* AI가 스타일 이름을 조금 다르게 적어도 가장 가까운 것으로 맞춥니다. */
      function matchStyle(raw, i) {
        const want = str(raw).toLowerCase();
        if (want) {
          const exact = STYLE_NAMES.find(n => n.toLowerCase() === want);
          if (exact) return exact;
          const partial = STYLE_NAMES.find(n => n.toLowerCase().includes(want) || want.includes(n.toLowerCase()));
          if (partial) return partial;
        }
        return STYLE_NAMES[i % STYLE_NAMES.length];
      }

      /* 형상을 지정하지 않고 오면 서로 다른 기본 형상을 돌려 씁니다. */
      const FORM_FALLBACK = [
        "a flat square material tile with softly radiused corners and visible thickness",
        "a rounded rectangular sample chip with a chamfered edge",
        "three stacked material coupons of slightly different thickness",
        "a gently curved sample strip with a clean cut edge",
        "a thin folded sample sheet with one lifted edge exposing its section",
        "a slim rectangular panel with one precision-cut corner revealing thickness",
        "a layered cross-section coupon with a clean exposed edge",
        "a flat circular material puck with a simple beveled rim"
      ];

      function clampValue(raw, level) {
        const n = Number(raw);
        if (Number.isFinite(n)) return Math.max(2, Math.min(98, Math.round(n)));
        const map = { "낮음": 22, "중간": 55, "높음": 84 };
        return map[str(level)] || 55;
      }
      function levelFromValue(v) { return v < 38 ? "낮음" : (v > 68 ? "높음" : "중간"); }

      function normConcepts(raw) {
        return arr(raw && raw.concepts).slice(0, 3).map((c, i) => ({
          id: uid("cpt"),
          index: i + 1,
          nameKo: str(c.nameKo) || `해석 ${i + 1}`,
          nameEn: str(c.nameEn) || `Concept ${i + 1}`,
          definition: str(c.definition) || NO_DATA,
          moodWords: arr(c.moodWords).map(str).filter(Boolean).slice(0, 6),
          experience: str(c.experience),
          cues: str(c.cues),
          subject: str(c.subject),
          visual: str(c.visual) || str(c.subject) || "an abstract still life on a neutral background",
          label: str(c.label) || str(c.nameEn) || `Concept ${i + 1}`,
          labelKo: str(c.labelKo) || str(c.nameKo),
          style: matchStyle(c.style, i)
        }));
      }

      function normPerceptions(raw) {
        return arr(raw && raw.perceptions).slice(0, 10).map((p, i) => ({
          id: uid("prc"),
          index: i + 1,
          category: str(p.category) || "지각",
          titleKo: str(p.titleKo) || `지각 특성 ${i + 1}`,
          titleEn: str(p.titleEn) || `Perception ${i + 1}`,
          description: str(p.description) || NO_DATA,
          cue: str(p.cue),
          visual: str(p.visual) || "a single object on a neutral background",
          label: str(p.label) || str(p.titleEn) || `Perception ${i + 1}`,
          labelKo: str(p.labelKo) || str(p.titleKo),
          style: matchStyle(p.style, i)
        }));
      }

      function normProperties(raw) {
        const levels = ["낮음", "중간", "높음"];
        return arr(raw && raw.properties).slice(0, 14).map((p, i) => ({
          id: uid("prp"),
          index: i + 1,
          axis: str(p.axis) || "물성",
          titleKo: str(p.titleKo) || `물성 ${i + 1}`,
          titleEn: str(p.titleEn) || `Property ${i + 1}`,
          description: str(p.description) || NO_DATA,
          check: str(p.check),
          value: clampValue(p.value, p.level),
          level: levels.includes(str(p.level)) ? str(p.level) : levelFromValue(clampValue(p.value, p.level)),
          visual: str(p.visual) || "a professional editorial close-up that clearly expresses this property through surface, light, depth, texture, motion trace or tactile cue",
          label: str(p.label) || str(p.titleEn) || `Property ${i + 1}`,
          labelKo: str(p.labelKo) || str(p.titleKo)
        }));
      }

      function normMaterials(raw) {
        return arr(raw && raw.materials).slice(0, 8).map((m, i) => ({
          id: uid("mat"),
          index: i + 1,
          nameKo: str(m.nameKo) || `소재 ${i + 1}`,
          nameEn: str(m.nameEn) || `Material ${i + 1}`,
          type: str(m.type) === "복합 소재" ? "복합 소재" : (str(m.type) || "단일 소재"),
          composition: str(m.composition) || NO_DATA,
          character: str(m.character) || NO_DATA,
          howTo: str(m.howTo) || NO_DATA,
          limit: str(m.limit) || NO_DATA,
          base: str(m.base),
          process: str(m.process),
          finish: str(m.finish),
          effect: str(m.effect),
          colorNote: str(m.colorNote),
          visual: str(m.visual) || "a flat material sample on a white studio background",
          label: str(m.label) || str(m.nameEn) || `Material ${i + 1}`,
          form: str(m.form) || FORM_FALLBACK[i % FORM_FALLBACK.length]
        }));
      }

      /* =========================================================
         10. 단계 이동 규칙 — 데이터가 준비된 단계까지만 이동
         ========================================================= */
      function stepReady(n) {
        switch (n) {
          case 1: return true;
          case 2: return state.concepts.length > 0;
          case 3: return state.perceptions.length > 0;
          case 4: return state.properties.length > 0;
          case 5: return state.materials.length > 0;
          default: return false;
        }
      }

      /* =========================================================
         11. 자동 저장
         ========================================================= */
      /* 홈(step 0)은 탐색 화면일 뿐 프로젝트 진행 단계가 아닙니다.
         저장 시 화면 위치가 아니라 실제 생성된 데이터의 가장 깊은 단계를 기록합니다. */
      function progressStep() {
        if (state.materials.length) return 5;
        if (state.properties.length) return 4;
        if (state.perceptions.length) return 3;
        if (state.concepts.length) return 2;
        return 1;
      }

      function snapshot() {
        return {
          projectId: state.projectId,
          keyword: state.keyword,
          note: state.note,
          concepts: state.concepts,
          conceptIds: state.conceptIds,
          perceptions: state.perceptions,
          perceptionIds: state.perceptionIds,
          properties: state.properties,
          propertyIds: state.propertyIds,
          materials: state.materials,
          materialIds: state.materialIds,
          createdAt: state.createdAt,
          step: progressStep()
        };
      }

      function hasContent() {
        return !!(state.keyword || state.concepts.length || state.perceptions.length ||
          state.properties.length || state.materials.length);
      }

      function projectTitle() {
        const c = selectedConcept();
        if (state.keyword && c) return `${state.keyword} · ${c.nameKo}`;
        if (state.keyword) return state.keyword;
        return "이름 없는 프로젝트";
      }

      /* 내용이 바뀌었을 때만 즉시 디스크에 기록합니다. 반환: Promise<"empty"|"same"|"ok"|"fail"> */
      let saveWarned = false;
      function persist(showToast) {
        if (!hasContent()) return Promise.resolve("empty");
        return Store.save(snapshot(), { id: state.projectId, title: projectTitle() }).then(r => {
          if (r === "fail") {
            if (!saveWarned || showToast) toast("저장하지 못했습니다. 저장 공간을 확인하고 리포트를 파일로 내려받아 주세요.", "error");
            saveWarned = true;
          } else {
            saveWarned = false;
            if (showToast) toast("진행 상태를 저장했습니다.");
          }
          return r;
        });
      }

      /* =========================================================
         12. 렌더 헬퍼 — 카드/버튼/이미지의 형식을 한곳에서 통일
         ========================================================= */
      function header(title, backStep) {
        const cur = STAGES.find(s => s.n === state.step);
        const nextN = state.step + 1;
        const showNext = STAGES.some(s => s.n === nextN) && stepReady(nextN);
        const pct = cur ? Math.round((cur.n / STAGES.length) * 100) : 0;
        return `
        <header class="fixed top-0 left-0 right-0 z-50 bg-white max-w-[430px] mx-auto">
          <div class="px-3 h-14 flex items-center justify-between gap-1">
            <div class="flex items-center gap-1 overflow-hidden flex-1 min-w-0">
              ${backStep !== undefined ? `<button type="button" aria-label="이전 단계로" onclick="setState({step:${backStep}}, true)" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-700 flex-shrink-0"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>` : ""}
              <h1 class="t-h3 truncate text-slate-900">${esc(title)}</h1>
            </div>
            <div class="flex items-center gap-0.5 flex-shrink-0 text-slate-700">
              ${showNext ? `<button type="button" aria-label="다음 단계로" onclick="setState({step:${nextN}}, true)" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-900"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>` : ""}
              <button type="button" aria-label="진행 상태 저장" onclick="Actions.saveNow()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="save" class="w-6 h-6"></i></button>
              <button type="button" aria-label="리포트 복사" onclick="Actions.copyReport()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="copy" class="w-6 h-6"></i></button>
              <button type="button" aria-label="처음 화면으로" onclick="Actions.goHome()" class="p-2.5 rounded-full hover:bg-slate-100 active:bg-slate-200"><i data-lucide="home" class="w-6 h-6"></i></button>
            </div>
          </div>
          ${cur ? `<div class="px-4 pb-2 flex items-center gap-3">
            <div class="h-2 bg-slate-300 rounded-full flex-1 overflow-hidden"><div class="h-full bg-blue-700 rounded-full transition-all" style="width:${pct}%"></div></div>
            <span class="t-meta font-bold text-slate-600 tabular-nums flex-shrink-0">${cur.n} / ${STAGES.length} · ${esc(cur.label)}</span>
          </div>` : ""}
        </header>`;
      }

      function dock(inner) {
        return `<div class="fixed bottom-0 left-0 right-0 px-5 pt-5 dock bg-white max-w-[430px] mx-auto z-[60]">${inner}</div>`;
      }

      function primaryBtn(label, onclick, disabled) {
        return `<button type="button" ${disabled ? "disabled" : ""} onclick="${onclick}"
          class="w-full py-5 rounded-2xl font-bold t-h3 text-white bg-slate-900 hover:bg-slate-800 disabled:bg-slate-200 disabled:text-slate-500 disabled:shadow-none shadow-lg active:scale-[0.98] disabled:active:scale-100 transition-all">${esc(label)}</button>`;
      }

      function secondaryBtn(label, onclick, icon) {
        return `<button type="button" onclick="${onclick}"
          class="w-full py-4 rounded-2xl font-bold t-small text-slate-700 bg-white border-2 border-slate-200 hover:bg-slate-50 active:scale-[0.98] transition-all flex items-center justify-center gap-2">${icon ? `<i data-lucide="${icon}" class="w-5 h-5"></i>` : ""}${esc(label)}</button>`;
      }

      function ghostBtn(label, onclick, icon) {
        return `<button type="button" onclick="${onclick}"
          class="px-4 py-2.5 rounded-xl font-bold t-meta text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 active:scale-95 transition-all inline-flex items-center gap-1.5">${icon ? `<i data-lucide="${icon}" class="w-4 h-4"></i>` : ""}${esc(label)}</button>`;
      }

      /* 모든 선택 카드는 테두리·체크 표시·선택 상태를 동일한 형식으로 씁니다. */
      function optionCard(opts) {
        const on = !!opts.selected;
        const badge = opts.badge
          ? `<span class="t-meta font-bold px-2.5 py-1 rounded-lg flex-shrink-0 ${on ? "bg-blue-100 text-blue-800" : "bg-slate-200 text-slate-700"}">${esc(opts.badge)}</span>`
          : "";
        return `<button type="button" onclick="${opts.onclick}" aria-pressed="${on}"
          class="w-full text-left p-5 rounded-[2rem] border-2 transition-all bg-white ${on ? "border-blue-700 shadow-lg ring-2 ring-blue-700/15" : "border-slate-200 hover:border-blue-300 shadow-md"}">
          <div class="flex items-start gap-3 mb-3">
            <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 font-bold t-meta tabular-nums ${on ? "bg-blue-700 text-white" : "bg-slate-200 text-slate-700"}">${on ? '<i data-lucide="check" class="w-5 h-5"></i>' : esc(pad2(opts.index))}</span>
            <div class="min-w-0 flex-1">
              <h3 class="t-h3 text-slate-900 leading-snug">${esc(opts.title)}</h3>
              ${opts.subtitle ? `<p class="t-meta text-slate-500">${esc(opts.subtitle)}</p>` : ""}
            </div>
            ${badge}
          </div>
          <div class="space-y-2">${opts.body || ""}</div>
        </button>`;
      }

      function chip(text, tone) {
        const cls = tone === "blue"
          ? "bg-blue-50 text-blue-800 border-blue-200"
          : "bg-slate-100 text-slate-700 border-slate-200";
        return `<span class="inline-block t-meta px-2.5 py-1 rounded-lg border ${cls}">${esc(text)}</span>`;
      }

      /* 단계별 통합 이미지 카드 */
      function imageCard(slot, opts) {
        const url = state.images ? state.images[slot] : null;
        const caption = opts.caption || "";
        const saveBtn = url
          ? `<button type="button" onclick="Actions.downloadImage('${slot}')"
               class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 t-meta font-bold hover:bg-slate-50 active:scale-[0.98] transition-all">
               <i data-lucide="download" class="w-4 h-4"></i>저장
             </button>`
          : "";
        const inner = url
          ? `<button type="button" onclick="Actions.openLightbox('${slot}')" class="block w-full">
               <img src="${escAttr(url)}" alt="${escAttr(opts.alt || "생성된 통합 이미지")}" class="w-full rounded-2xl bg-slate-100" />
             </button>`
          : `<div class="w-full rounded-2xl bg-slate-100 border-2 border-dashed border-slate-300 px-5 py-12 text-center">
               <i data-lucide="image" class="w-10 h-10 text-slate-400 mx-auto mb-3"></i>
               <p class="t-small text-slate-600">${esc(opts.empty || "아직 이미지를 생성하지 않았습니다.")}</p>
               ${opts.onGenerate ? `<button type="button" onclick="${opts.onGenerate}"
                  class="mt-4 inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-slate-900 text-white t-small font-bold active:scale-[0.98] transition-all">
                  <i data-lucide="image-plus" class="w-5 h-5"></i>이미지 생성</button>` : ""}
             </div>`;
        return `<section class="bg-white rounded-[2rem] p-4 border-2 border-slate-200 shadow-md mb-6">
          <div class="flex items-center justify-between gap-3 mb-3 px-1">
            <h3 class="t-label text-slate-500">${esc(opts.title)}</h3>
            ${saveBtn}
          </div>
          ${inner}
          ${caption ? `<p class="t-meta text-slate-500 mt-3 px-1 prose-ko">${esc(caption)}</p>` : ""}
        </section>`;
      }

      function instructionBox(stage, placeholder) {
        const def = EDIT_STAGES[stage];
        const id = def.insId;
        const list = def.list();
        const t = editTargetOf(stage);
        const chipCls = on => `min-w-[52px] px-3 py-2 rounded-xl t-meta font-bold border transition-all active:scale-95 ${on ? "bg-blue-50 border-blue-600 text-blue-800" : "bg-white border-slate-300 text-slate-600 hover:bg-slate-50"}`;
        const chips = list.map((it, i) => `<button type="button" onclick="Actions.setEditTarget('${stage}', ${i})" aria-pressed="${t === i}" class="${chipCls(t === i)}">${pad2(i + 1)}</button>`).join("")
          + `<button type="button" onclick="Actions.setEditTarget('${stage}', 'all')" aria-pressed="${t === "all"}" class="${chipCls(t === "all")}">전체</button>`;
        const picked = t === "all" ? `전체 ${list.length}개를 다시 생성합니다` : (list[t] ? `${pad2(t + 1)} · ${def.title(list[t])}` : "");
        return `<section class="p-5 bg-slate-50 border-2 border-slate-200 rounded-3xl mt-8">
          <h3 class="t-label text-slate-500 mb-3">수정 지시</h3>
          <p class="t-meta font-bold text-slate-600 mb-2">수정할 항목</p>
          <div class="flex flex-wrap gap-2 mb-2" role="group" aria-label="수정할 항목 선택">${chips}</div>
          <p class="t-meta text-slate-700 mb-3 prose-ko">${esc(picked)}</p>
          <label for="${id}" class="sr-only">수정 지시 입력</label>
          <textarea id="${id}" rows="3" oninput="setDraft('${id}', this.value)"
            class="w-full block min-w-0 bg-white border border-slate-300 rounded-xl px-4 py-3.5 text-slate-800 t-small outline-none resize-none placeholder:text-slate-400 focus:border-blue-500 mb-3"
            placeholder="${escAttr(placeholder)}">${esc(draft(id))}</textarea>
          <button type="button" onclick="Actions.reviseStage('${stage}')"
            class="w-full py-4 rounded-xl bg-white border-2 border-slate-300 text-slate-700 hover:bg-slate-100 font-bold t-small flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
            <i data-lucide="send" class="w-5 h-5"></i>${t === "all" ? "지시대로 전체 다시 생성" : `${pad2(t + 1)}번 항목만 수정`}
          </button>
        </section>`;
      }

      /* 각 단계 상단 — 앞 단계에서 무엇을 골랐는지 그대로 보여 줍니다. */
      function priorChoice(rows) {
        const list = rows.filter(r => r && r.value);
        if (!list.length) return "";
        return `<section class="bg-white border-2 border-slate-200 rounded-[1.5rem] px-5 py-4 mb-6 shadow-sm">
          ${list.map(r => `<div class="py-1 border-t border-slate-100 first:border-t-0 first:pt-0">
            <span class="t-meta font-bold text-slate-500">${esc(r.label)}</span>
            <p class="t-small text-slate-800 prose-ko">${esc(r.value)}</p>
          </div>`).join("")}
        </section>`;
      }

      function joinTitles(items, key) {
        return items.map((it, i) => `${pad2(i + 1)} ${it[key]}`).join("   ");
      }

      function sectionTitle(text, sub) {
        return `<h2 class="t-h1 text-slate-900 mb-2">${esc(text)}</h2>
          ${sub ? `<p class="t-small text-slate-600 mb-6 prose-ko">${esc(sub)}</p>` : `<div class="mb-6"></div>`}`;
      }

      /* =========================================================
         13. 리포트
         ========================================================= */
      function buildReport() {
        const L = [];
        const line = "==================================================";
        L.push(line, "   감성 · 지각 · 물성 · CMF 랩 · 종합 리포트", line, "");
        L.push("[감성 키워드]", `- ${state.keyword || "설정된 키워드 없음"}`);
        L.push(`- 감성 해석 방식: ${EMOTION_METHOD.label} (${EMOTION_METHOD.en})`);
        if (state.note) L.push(`- 연관 과제: ${state.note}`);
        L.push("");

        if (state.concepts.length) {
          L.push(line, " 1. 감성 해석", line);
          state.concepts.forEach((c, i) => {
            const on = state.conceptIds.includes(c.id) ? "  ★ 선택됨" : "";
            L.push("", `${pad2(i + 1)}. ${c.nameKo} / ${c.nameEn}${on}`);
            if (c.moodWords.length) L.push(`  감성 단어: ${c.moodWords.join(" · ")}`);
            if (c.subject) L.push(`  대표 장면: ${c.subject}`);
            L.push(`  ${c.definition}`);
            if (c.experience) L.push(`  체감: ${c.experience}`);
          });
          L.push("");
        }

        if (state.perceptions.length) {
          L.push(line, " 2. 지각 특성", line);
          state.perceptions.forEach((p, i) => {
            const on = state.perceptionIds.includes(p.id) ? "  ★ 선택됨" : "";
            L.push("", `${pad2(i + 1)}. [${p.category}] ${p.titleKo} / ${p.titleEn}${on}`);
            L.push(`  ${p.description}`);
            if (p.cue) L.push(`  관찰 단서: ${p.cue}`);
          });
          L.push("");
        }

        if (state.properties.length) {
          L.push(line, " 3. 물성 정의", line);
          state.properties.forEach((p, i) => {
            const on = state.propertyIds.includes(p.id) ? "  ★ 선택됨" : "";
            L.push("", `${pad2(i + 1)}. [${p.axis}] ${p.titleKo} / ${p.titleEn} · 목표 ${p.level} (LOW 0 - HIGH 100 축에서 ${p.value})${on}`);
            L.push(`  ${p.description}`);
            if (p.check) L.push(`  확인 방법: ${p.check}`);
          });
          L.push("");
        }

        if (state.materials.length) {
          L.push(line, " 4. CMF 제안", line);
          state.materials.forEach((m, i) => {
            L.push("", `${pad2(i + 1)}. ${m.nameKo} / ${m.nameEn}${state.materialIds.includes(m.id) ? "  ★ 선택됨" : ""}  (${m.type})`);
            if (m.base) L.push(`  소재: ${m.base}`);
            if (m.process) L.push(`  Process: ${m.process}`);
            if (m.finish) L.push(`  Finish: ${m.finish}`);
            if (m.effect) L.push(`  Effect: ${m.effect}`);
            L.push(`  구성: ${m.composition}`);
            L.push(`  특징: ${m.character}`);
            L.push(`  물성 구현: ${m.howTo}`);
            L.push(`  한계: ${m.limit}`);
            if (m.colorNote) L.push(`  색 방향: ${m.colorNote}`);
          });
          L.push("");
        }

        L.push(line, `생성 시각: ${nowLabel(Date.now())}`, line);
        return L.join("\n");
      }


      /* =========================================================
         13-A. 시뮬레이터 제작 프롬프트
         최종 CMF 안을 '도약 CMF 큐브 · 실물 사양' 형식의 3D 큐브 뷰어로 만들게 하는 프롬프트입니다.
         API를 쓰지 않고 현재 결과로 즉시 조립하므로 비용이 들지 않습니다.

      function buildSimPrompt() {

          L.push("");
          L.push("# 선택된 물성 (LOW 0 – HIGH 100 목표값)");

        }
        L.push("");
        L.push(`# 구현할 CMF 안 ${n}개`);

          if (m.colorNote) L.push(`- 색 방향: ${m.colorNote}`);
        });
        L.push("");
        L.push("# 첨부한 CMF 샘플 보드 이미지 참조 (반드시 따름)");
        L.push(`- 이 프롬프트와 함께 CMF 샘플 보드 이미지 1장(01–${pad2(state.materials.length)}번)을 첨부합니다.${picked.length && picked.length < state.materials.length ? ` 이 중 위에 적힌 ${list.map(no).join(", ")}번 카드만 구현합니다.` : ""}`);
        L.push("- 보드의 각 카드는 위 'CMF 안'의 같은 번호 항목입니다. 카드 번호와 이름으로 서로 대응시킵니다.");
        L.push("- 보드 이미지를 색과 표면의 시각 기준으로 삼습니다: 기본색과 그라데이션, 광택 수준, 하이라이트 모양, 질감과 패턴의 크기·방향, 투명도와 깊이, 층 구조, 엣지 처리를 최대한 비슷하게 절차 텍스처와 재질 값으로 재현합니다.");
        L.push("- 역할 분담: 색·질감·패턴의 생김새는 보드 이미지를, 소재 규격·공정·마감·물성 수치는 이 프롬프트의 텍스트를 우선합니다.");
        L.push("- 보드의 레이아웃(카드 격자·글자)은 복제하지 않습니다. 이미지가 첨부되지 않았거나 읽을 수 없으면 텍스트 사양만으로 구현합니다.");

        L.push("5. 복합 소재는 바깥층(outer)과 안쪽층(inner)을 따로 만들고, 안쪽층은 사양 두께만큼 안쪽으로 평행 오프셋한 큐브로 겹칩니다(예: 투명 PC 아래 증착층, 유리 아래 인쇄층).");
        L.push("6. 재질 수치는 과장 없이 실제 문헌값(IOR, 금속도, 거칠기 등)을 기준으로 합니다. 발광은 기본 0%(실물)이고, '효과' 탭의 슬라이더로만 강조합니다.");
        L.push(`7. 화면: 전체 화면 캔버스 + 상단 제목(프로그램명)과 부제(현재 소재 번호·이름) + 오른쪽 위 세그먼트 버튼 [단일 | ${n}종 비교]. 비교 모드는 세로 화면 2열·가로 화면 4열 격자로 배치하고 선택한 시편 바닥에 링을 표시합니다.`);
        L.push("8. 하단 시트: 드래그 또는 탭으로 접고 펼치며, 양옆에 이전/다음 버튼을 둡니다. 시트 안에는 소재 칩(대표색 스와치 + 번호·이름 + 소재 규격)을 가로 스크롤 스냅으로 배치하고, 아래에 탭 4개를 둡니다.");

      /* =========================================================
         13-B. PDF 리포트 — 분석 내용과 생성 이미지를 함께 담습니다.
         화면 밖에 인쇄용 문서를 만들고 블록 단위로 캡처해 A4에 배치합니다.
         블록 단위로 나누면 문장이 페이지 경계에서 잘리지 않습니다.
         ========================================================= */
      const PDF = {
        W: 794,
        blk(inner, pad) {
          return `<div style="box-sizing:border-box;width:794px;padding:${pad || "0 0 14px 0"};background:#ffffff;font-family:'Pretendard',sans-serif;color:#0f172a;">${inner}</div>`;
        },
        heading(no, title, en) {
          return PDF.blk(`<div style="border-top:3px solid #0f172a;padding-top:12px;margin-top:18px;">

        card(inner) {

                  <span style="font-size:14px;color:#64748b;font-weight:700;margin-left:6px;">${esc(x.category)}</span></div>

                  ${x.base ? `<div style="font-size:17px;font-weight:800;">${esc(x.base)}</div>` : ""}

                ${PDF.kv("구성", x.composition)}

      /* 이미지가 끝내 로드되지 않아도 PDF 생성이 멈추지 않도록 기다림에 상한을 둡니다. */
      function waitForImages(root, timeoutMs) {
        const imgs = Array.from(root.querySelectorAll("img"));
        const all = Promise.all(imgs.map(im => (im.complete && im.naturalWidth)
          ? Promise.resolve()
          : new Promise(res => { im.onload = res; im.onerror = res; })));
        return Promise.race([all, new Promise(res => setTimeout(res, timeoutMs || 6000))]);
      }

      async function exportPdf() {
        const h2c = window.html2canvas;
        const JsPDF = window.jspdf && window.jspdf.jsPDF;
        if (!h2c || !JsPDF) {
          toast("PDF 모듈을 불러오지 못했습니다. 텍스트로 내려받습니다.", "error");
          downloadText(`cmf-report-${Date.now()}.txt`, buildReport());
          return;
        }

        const holder = document.createElement("div");
        holder.setAttribute("aria-hidden", "true");
        holder.style.cssText = `position:absolute;left:-10000px;top:0;width:${PDF.W}px;background:#ffffff;`;
        holder.innerHTML = PDF.document();
        document.body.appendChild(holder);

        try {
          await waitForImages(holder);
          if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) { /* 무시 */ } }

          const pdf = new JsPDF({ unit: "pt", format: "a4" });
          const pw = pdf.internal.pageSize.getWidth();
          const ph = pdf.internal.pageSize.getHeight();
          const M = 34;
          const maxW = pw - M * 2;
          const maxH = ph - M * 2;
          let y = M;
          let placed = 0;

          const blocks = Array.from(holder.children);
          for (const b of blocks) {
            const canvas = await h2c(b, { scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false });
            let w = maxW;
            let h = canvas.height * maxW / canvas.width;
            if (h > maxH) { h = maxH; w = canvas.width * maxH / canvas.height; }
            if (placed && y + h > ph - M) { pdf.addPage(); y = M; }
            pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", M + (maxW - w) / 2, y, w, h);
            y += h + 6;
            placed += 1;
          }
          if (!placed) throw new Error("리포트에 담을 내용이 없습니다.");
          pdf.save(`CMF-리포트-${(state.keyword || "무제").slice(0, 20)}.pdf`);
        } finally {
          if (holder.parentNode) holder.parentNode.removeChild(holder);
        }
      }

      function downloadText(name, text) {
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      /* =========================================================
         14. ACTIONS
         ========================================================= */
      /* 앞 단계 선택을 바꾸면 이후 결과가 지워지므로 먼저 확인합니다. */
      const confirmDiscard = what => window.confirm(`이 항목을 바꾸면 이미 만든 ${what} 결과가 지워집니다. 계속할까요?`);

      /* 각 단계의 '수정 지시'가 다루는 항목 목록과 다시 쓰는 방법 */
      const EDIT_STAGES = {
        emotion: {
          insId: "ins-emotion", key: "concepts", label: "감성 해석",
          list: () => state.concepts,
          title: it => it.nameKo,
          norm: d => normConcepts(d),
          prompt: ins => PROMPTS.EMOTION(state.keyword, state.note, ins),
          isSelected: it => state.conceptIds.includes(it.id),
          hasDown: () => !!(state.perceptions.length || state.properties.length || state.materials.length),
          downLabel: "지각·물성·CMF",
          clearDown: () => ({ slots: ["perception", "property", "material"], patch: { perceptions: [], perceptionIds: [], properties: [], propertyIds: [], materials: [], materialIds: [] } }),
          all: ins => Actions.generateConcepts(ins),
          image: () => Actions.generateEmotionImage()
        },
        perception: {
          insId: "ins-perception", key: "perceptions", label: "지각 특성",
          list: () => state.perceptions,
          title: it => it.titleKo,
          norm: d => normPerceptions(d),
          prompt: ins => PROMPTS.PERCEPTION(state.keyword, selectedConcept(), ins),
          isSelected: it => state.perceptionIds.includes(it.id),
          hasDown: () => !!(state.properties.length || state.materials.length),
          downLabel: "물성·CMF",
          clearDown: () => ({ slots: ["property", "material"], patch: { properties: [], propertyIds: [], materials: [], materialIds: [] } }),
          all: ins => Actions.generatePerceptions(ins),
          image: () => Actions.generatePerceptionImage()
        },
        property: {
          insId: "ins-property", key: "properties", label: "물성",
          list: () => state.properties,
          title: it => it.titleKo,
          norm: d => normProperties(d),
          prompt: ins => PROMPTS.PROPERTY(selectedConcept(), selectedPerceptions(), ins),
          isSelected: it => state.propertyIds.includes(it.id),
          hasDown: () => !!state.materials.length,
          downLabel: "CMF",
          clearDown: () => ({ slots: ["material"], patch: { materials: [], materialIds: [] } }),
          all: ins => Actions.generateProperties(ins),
          image: () => Actions.generatePropertyImage()
        },
        material: {
          insId: "ins-material", key: "materials", label: "CMF 제안",
          list: () => state.materials,
          title: it => it.nameKo,
          norm: d => normMaterials(d),
          prompt: ins => PROMPTS.MATERIAL(selectedConcept() || { nameKo: state.keyword, nameEn: "" }, selectedProperties(), ins),
          isSelected: () => false,
          hasDown: () => false,
          all: ins => Actions.generateMaterials(ins),
          image: () => Actions.generateMaterialImage()
        }
      };

      /* 선택한 항목 번호(0부터) — 목록이 바뀌어 범위를 벗어나면 첫 항목으로 */
      function editTargetOf(stage) {
        const t = state.editTarget[stage];
        if (t === "all") return "all";
        const n = EDIT_STAGES[stage].list().length;
        return Number.isInteger(t) && t >= 0 && t < n ? t : 0;
      }

      function stripItem(it) {
        const o = {};
        Object.keys(it || {}).forEach(k => { if (k !== "id" && k !== "index") o[k] = it[k]; });
        return o;
      }

      function reviseNote(def, idx, ins) {
        const list = def.list();
        const others = list.map((it, i) => i === idx ? null : `${pad2(i + 1)}. ${def.title(it)}`).filter(Boolean).join("\n");
        return `[항목 단위 수정 — 이 규칙이 앞의 개수 규칙보다 우선합니다]
전체 ${list.length}개 중 ${pad2(idx + 1)}번 항목 하나만 아래 수정 지시에 따라 다시 작성합니다. "${def.key}" 배열에 정확히 1개만 넣습니다. 같은 형식(JSON 키)을 그대로 지킵니다.
수정 지시: ${ins || "지시가 따로 없습니다. 같은 역할을 유지하면서 더 완성도 있고 분명하게 다시 작성합니다."}
현재 ${pad2(idx + 1)}번 항목: ${JSON.stringify(stripItem(list[idx]))}
그대로 유지되는 다른 항목입니다. 이것들과 겹치지 않게 합니다:
${others}`;
      }

      const Actions = {
        /* ---- 접속 / 프로젝트 ---- */
        validateKey() {
          const el = document.getElementById("api-input");
          const key = el ? el.value.trim() : "";
          if (!key) { setState({ errorMsg: "API 키를 입력해 주세요." }); return; }
          if (!/^sk-/.test(key)) { setState({ errorMsg: "OpenAI API 키는 sk- 로 시작합니다. 키를 다시 확인해 주세요." }); return; }
          state.apiKey = key;
          saveSession();
          setState({ step: 0, errorMsg: null }, true);
        },

        setEditTarget(stage, v) {
          state.editTarget = Object.assign({}, state.editTarget, { [stage]: v === "all" ? "all" : Number(v) });
          render();
        },
        async reviseStage(stage) {
          const def = EDIT_STAGES[stage];
          if (!def) return;
          const ins = draft(def.insId).trim();
          const target = editTargetOf(stage);
          if (target === "all") {
            drafts[def.insId] = "";
            await def.all(ins);
            return;
          }
          const list = def.list();
          const item = list[target];
          if (!item) return;
          const downstream = def.isSelected(item) && def.hasDown();
          if (downstream && !confirmDiscard(def.downLabel)) return;

          const data = await withLoading(`${def.label} ${pad2(target + 1)}번을 수정하고 있습니다`, () =>
            callText(SYSTEM, def.prompt(reviseNote(def, target, ins))));
          if (!data) return;
          const fresh = def.norm(data)[0];
          if (!fresh) { setState({ errorMsg: "수정된 항목을 받지 못했습니다. 다시 시도해 주세요." }); return; }
          fresh.id = item.id;
          fresh.index = item.index;
          const next = list.slice();
          next[target] = fresh;
          const patch = { [def.key]: next };
          /* 이 단계의 기존 이미지는 수정 전 내용이므로 함께 지웁니다.
             새 이미지 생성이 실패·취소되거나 도중에 앱을 닫아도, 다시 열었을 때 수정 전 이미지가 되살아나지 않습니다. */
          const staleSlots = [stage];
          if (downstream) {
            const d = def.clearDown();
            staleSlots.push.apply(staleSlots, d.slots);
            Object.assign(patch, d.patch);
          }
          await Actions.clearImageSlots(staleSlots);
          patch.images = Object.assign({}, state.images);
          drafts[def.insId] = "";
          setState(patch);
          await persist(false);
          toast(`${pad2(target + 1)}번 항목을 수정했습니다. 이미지를 다시 만듭니다.`);
          await def.image();
        },

        pickKeyword(i) {
          const w = SAMPLE_KEYWORDS[i];
          if (!w) return;
          drafts["keyword-input"] = w;
          render();
          const el = document.getElementById("keyword-input");
          if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(w.length, w.length); } catch (e) { /* 무시 */ } }
        },

        /* ---- 시뮬레이터 제작 프롬프트 ---- */
        openSimPrompt() {
          if (!state.materials.length) { toast("먼저 CMF 제안을 만들어 주세요.", "error"); return; }
          setState({ simPrompt: buildSimPrompt() });
        },
        closeSimPrompt() { setState({ simPrompt: null }); },
        copySimPrompt() {
          const text = state.simPrompt || "";
          const fallback = () => {
            const ta = document.getElementById("sim-prompt-text");
            if (ta) { ta.focus(); ta.select(); try { ta.setSelectionRange(0, text.length); } catch (e) { /* 무시 */ } }
            let ok = false;
            try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
            toast(ok ? "프롬프트를 복사했습니다." : "자동 복사가 막혀 있습니다. 글을 길게 눌러 직접 복사해 주세요.", ok ? undefined : "error");
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => toast("프롬프트를 복사했습니다.")).catch(fallback);
          } else fallback();
        },
        downloadSimPrompt() {
          downloadText(`cmf-simulator-prompt-${(state.keyword || "무제").replace(/[\\/:*?"<>|\s]/g, "_").slice(0, 20)}.txt`, state.simPrompt || "");
        },

        startNewProject() {
          persist(false);
          state.simPrompt = null; state.editTarget = {}; state.lightbox = null;
          Object.assign(state, blankProject());
          drafts["keyword-input"] = "";
          drafts["note-input"] = "";
          setState({ step: 1 }, true);
        },

        async openProject(id) {
          const row = Store.list().find(p => p.id === id);
          if (!row || !row.data) { toast("프로젝트를 찾지 못했습니다.", "error"); return; }
          persist(false);
          state.simPrompt = null; state.editTarget = {}; state.lightbox = null;
          const d = row.data;
          Object.assign(state, blankProject(), {
            projectId: d.projectId || row.id,
            keyword: d.keyword || "",
            note: d.note || "",
            concepts: arr(d.concepts),
            conceptIds: arr(d.conceptIds).length ? arr(d.conceptIds) : (d.conceptId ? [d.conceptId] : []),
            perceptions: arr(d.perceptions),
            perceptionIds: arr(d.perceptionIds),
            properties: arr(d.properties),
            propertyIds: arr(d.propertyIds),
            materials: arr(d.materials),
            materialIds: arr(d.materialIds),
            createdAt: d.createdAt || row.savedAt,
            images: { emotion: null, perception: null, property: null, material: null }
          });
          drafts["keyword-input"] = state.keyword;
          drafts["note-input"] = state.note;

          /* 구버전에서 step이 1로 잘못 저장된 프로젝트도 데이터 기준으로 정상 복구합니다. */
          setState({ step: progressStep() }, true);

          const imgs = await ImageDB.loadAll(state.projectId);
          /* 구버전이 남긴 고아 이미지도 정리합니다. 데이터가 없는 단계의 이미지는 복원하지 않습니다. */
          const orphanSlots = [];
          if (!state.concepts.length && imgs.emotion) orphanSlots.push("emotion");
          if (!state.perceptions.length && imgs.perception) orphanSlots.push("perception");
          if (!state.properties.length && imgs.property) orphanSlots.push("property");
          if (!state.materials.length && imgs.material) orphanSlots.push("material");
          orphanSlots.forEach(slot => { imgs[slot] = null; });
          if (orphanSlots.length) await ImageDB.removeSlots(state.projectId, orphanSlots);
          setState({ images: Object.assign({ emotion: null, perception: null, property: null, material: null }, imgs) });
        },

        deleteProject(id) {
          if (!window.confirm("이 프로젝트와 생성된 이미지를 모두 지웁니다. 계속할까요?")) return;
          Store.remove(id);
          /* 지금 열려 있는 프로젝트였다면 비워 둡니다. 그러지 않으면 자동 저장이 되살립니다. */
          if (state.projectId === id) Object.assign(state, blankProject());
          toast("프로젝트를 삭제했습니다.");
          render();
        },

        goHome() {
          /* 현재 분석 진행도를 먼저 저장하고 홈으로 이동합니다.
             이후 홈에서 자동 저장이 실행돼도 snapshot()이 progressStep()을 사용하므로 진행 단계가 1로 되돌아가지 않습니다. */
          persist(false);
          setState({ step: 0 }, true);
        },
        saveNow() {
          persist(true).then(r => { if (r === "empty") toast("아직 저장할 내용이 없습니다."); });
        },

        copyReport() {
          const text = buildReport();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
              .then(() => toast("리포트를 클립보드에 복사했습니다."))
              .catch(() => downloadText("cmf-report.txt", text));
          } else {
            downloadText("cmf-report.txt", text);
          }
        },
        downloadReport() { downloadText(`cmf-report-${Date.now()}.txt`, buildReport()); },
        async exportPdf() {
          setState({ isAnalyzing: true, loadingMsg: "리포트를 PDF로 만들고 있습니다", errorMsg: null });
          try {
            await exportPdf();
            setState({ isAnalyzing: false });
            toast("PDF를 내려받았습니다.");
          } catch (err) {
            console.error(err);
            setState({ isAnalyzing: false, errorMsg: "PDF를 만들지 못했습니다. 잠시 후 다시 시도해 주세요." });
          }
        },

        cancel() { if (activeController) activeController.abort(); },

        /* ---- 이미지 공통 ---- */
        openLightbox(slot) { setState({ lightbox: slot }); },
        closeLightbox() { setState({ lightbox: null }); },
        downloadImage(slot) {
          const url = state.images[slot];
          if (!url) return;
          const a = document.createElement("a");
          a.href = url;
          a.download = `cmf-${slot}-${Date.now()}.png`;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
        },
        async saveImage(slot, dataUrl) {
          state.images = Object.assign({}, state.images, { [slot]: dataUrl });
          await ImageDB.put(state.projectId, slot, dataUrl);
        },
        async clearImageSlots(slots) {
          const targets = Array.from(new Set(arr(slots).filter(slot => IMAGE_SLOTS.includes(slot))));
          if (!targets.length) return;
          const nextImages = Object.assign({}, state.images);
          targets.forEach(slot => { nextImages[slot] = null; });
          state.images = nextImages;
          await ImageDB.removeSlots(state.projectId, targets);
        },

        /* ---- 1단계 → 감성 해석 ---- */
        async generateConcepts(instruction) {
          const kw = (drafts["keyword-input"] !== undefined ? drafts["keyword-input"] : state.keyword).trim();
          const note = (drafts["note-input"] !== undefined ? drafts["note-input"] : state.note).trim();
          if (!kw) { setState({ errorMsg: "감성 키워드를 입력해 주세요." }); return; }
          state.keyword = kw;
          state.note = note;

          const concepts = await withLoading("감성을 세가지 경험으로 해석하고 있습니다", async () => {
            const mk = extra => PROMPTS.EMOTION(kw, note, joinIns(instruction || "", extra));
            return fillToCount({ items: normConcepts(await callText(SYSTEM, mk(""))), target: 3, key: "concepts",
              label: "감성 해석", titleOf: x => x.nameKo, norm: normConcepts, prompt: mk });
          });
          if (!concepts) return;
          if (!concepts.length) { setState({ errorMsg: "감성 해석을 받지 못했습니다. 다시 시도해 주세요." }); return; }

          await Actions.clearImageSlots(["emotion", "perception", "property", "material"]);
          setState({
            concepts,
            conceptIds: [],
            perceptions: [], perceptionIds: [],
            properties: [], propertyIds: [],
            materials: [],
            images: { emotion: null, perception: null, property: null, material: null },
            step: 2
          }, true);
          persist(false);
          await Actions.generateEmotionImage();
        },
        async regenerateConcepts() {
          const ins = draft("ins-emotion").trim();
          drafts["ins-emotion"] = "";
          await Actions.generateConcepts(ins);
        },
        async generateEmotionImage() {
          if (!state.concepts.length) return;
          const url = await withLoading("감성 해석 통합 이미지를 만들고 있습니다", () =>
            callImage(IMG.emotion(state.concepts)));
          if (!url) return;
          await Actions.saveImage("emotion", url);
          render();
        },

        /* ---- 2단계 → 지각 특성 ---- */
        toggleMaterial(id) {
          const on = state.materialIds.includes(id);
          setState({ materialIds: on ? state.materialIds.filter(x => x !== id) : state.materialIds.concat(id) });
          persist(false);
        },
        selectAllMaterials() {
          const all = state.materials.length > 0 && state.materialIds.length === state.materials.length;
          setState({ materialIds: all ? [] : state.materials.map(m => m.id) });
          persist(false);
        },
        async toggleConcept(id) {
          const on = state.conceptIds.includes(id);
          await Actions.applyConceptIds(on ? state.conceptIds.filter(x => x !== id) : state.conceptIds.concat(id));
        },
        async selectAllConcepts() {
          const all = state.concepts.length > 0 && state.conceptIds.length === state.concepts.length;
          await Actions.applyConceptIds(all ? [] : state.concepts.map(c => c.id));
        },
        async applyConceptIds(nextIds) {
          if (state.perceptions.length || state.properties.length || state.materials.length) {
            await Actions.clearImageSlots(["perception", "property", "material"]);
            setState({
              conceptIds: nextIds,
              perceptions: [], perceptionIds: [],
              properties: [], propertyIds: [],
              materials: [], materialIds: [],
              images: Object.assign({}, state.images, { perception: null, property: null, material: null })
            });
            persist(false);
            return;
          }
          setState({ conceptIds: nextIds });
        },
        async generatePerceptions(instruction) {
          const c = selectedConcept();
          if (!c) { setState({ errorMsg: "감성 해석을 먼저 선택해 주세요." }); return; }

          const perceptions = await withLoading("지각 특성을 정리하고 있습니다", async () => {
            const mk = extra => PROMPTS.PERCEPTION(state.keyword, c, joinIns(instruction || "", extra));
            return fillToCount({ items: normPerceptions(await callText(SYSTEM, mk(""))), target: 10, key: "perceptions",
              label: "지각 특성", titleOf: x => x.titleKo, norm: normPerceptions, prompt: mk });
          });
          if (!perceptions) return;
          if (!perceptions.length) { setState({ errorMsg: "지각 특성을 받지 못했습니다. 다시 시도해 주세요." }); return; }

          await Actions.clearImageSlots(["perception", "property", "material"]);
          setState({
            perceptions,
            perceptionIds: [],
            properties: [], propertyIds: [],
            materials: [],
            images: Object.assign({}, state.images, { perception: null, property: null, material: null }),
            step: 3
          }, true);
          persist(false);
          await Actions.generatePerceptionImage();
        },
        async regeneratePerceptions() {
          const ins = draft("ins-perception").trim();
          drafts["ins-perception"] = "";
          await Actions.generatePerceptions(ins);
        },
        async generatePerceptionImage() {
          if (!state.perceptions.length) return;
          const url = await withLoading("지각 특성 통합 이미지를 만들고 있습니다", () =>
            callImage(IMG.perception(state.perceptions)));
          if (!url) return;
          await Actions.saveImage("perception", url);
          render();
        },

        /* ---- 3단계 → 물성 정의 ---- */
        async togglePerception(id) {
          const on = state.perceptionIds.includes(id);
          const nextIds = on ? state.perceptionIds.filter(x => x !== id) : state.perceptionIds.concat(id);
          if (state.properties.length || state.materials.length) {
            await Actions.clearImageSlots(["property", "material"]);
            setState({
              perceptionIds: nextIds,
              properties: [], propertyIds: [],
              materials: [],
              images: Object.assign({}, state.images, { property: null, material: null })
            });
            persist(false);
            return;
          }
          setState({ perceptionIds: nextIds });
        },
        async selectAllPerceptions() {
          const all = state.perceptions.length === state.perceptionIds.length;
          const nextIds = all ? [] : state.perceptions.map(p => p.id);
          if (state.properties.length || state.materials.length) {
            await Actions.clearImageSlots(["property", "material"]);
            setState({
              perceptionIds: nextIds,
              properties: [], propertyIds: [],
              materials: [],
              images: Object.assign({}, state.images, { property: null, material: null })
            });
            persist(false);
            return;
          }
          setState({ perceptionIds: nextIds });
        },
        async generateProperties(instruction) {
          const c = selectedConcept();
          const picked = selectedPerceptions();
          if (!c) { setState({ errorMsg: "감성 해석을 먼저 선택해 주세요." }); return; }
          if (!picked.length) { setState({ errorMsg: "지각 요소를 하나 이상 선택해 주세요." }); return; }

          const properties = await withLoading("물성 특성을 정의하고 있습니다", async () => {
            const mk = extra => PROMPTS.PROPERTY(c, picked, joinIns(instruction || "", extra));
            const first = normProperties(await callText(SYSTEM, mk("")));
            /* 물성은 10~14개 — 10개보다 적을 때만 채웁니다. */
            return first.length >= 10 ? first : fillToCount({ items: first, target: 10, key: "properties",
              label: "물성", titleOf: x => x.titleKo, norm: normProperties, prompt: mk });
          });
          if (!properties) return;
          if (!properties.length) { setState({ errorMsg: "물성 정의를 받지 못했습니다. 다시 시도해 주세요." }); return; }

          await Actions.clearImageSlots(["property", "material"]);
          setState({
            properties,
            propertyIds: [],
            materials: [],
            images: Object.assign({}, state.images, { property: null, material: null }),
            step: 4
          }, true);
          persist(false);
          await Actions.generatePropertyImage();
        },
        async regenerateProperties() {
          const ins = draft("ins-property").trim();
          drafts["ins-property"] = "";
          await Actions.generateProperties(ins);
        },
        async generatePropertyImage() {
          if (!state.properties.length) return;
          const url = await withLoading("물성 통합 이미지를 만들고 있습니다", () =>
            callImage(IMG.property(state.properties)));
          if (!url) return;
          await Actions.saveImage("property", url);
          render();
        },

        /* ---- 4단계 → 소재 제안 ---- */
        async toggleProperty(id) {
          const on = state.propertyIds.includes(id);
          const nextIds = on ? state.propertyIds.filter(x => x !== id) : state.propertyIds.concat(id);
          if (state.materials.length) {
            await Actions.clearImageSlots(["material"]);
            setState({
              propertyIds: nextIds,
              materials: [],
              images: Object.assign({}, state.images, { material: null })
            });
            persist(false);
            return;
          }
          setState({ propertyIds: nextIds });
        },
        async selectAllProperties() {
          const all = state.properties.length === state.propertyIds.length;
          const nextIds = all ? [] : state.properties.map(p => p.id);
          if (state.materials.length) {
            await Actions.clearImageSlots(["material"]);
            setState({
              propertyIds: nextIds,
              materials: [],
              images: Object.assign({}, state.images, { material: null })
            });
            persist(false);
            return;
          }
          setState({ propertyIds: nextIds });
        },
        async generateMaterials(instruction) {
          const c = selectedConcept();
          const picked = selectedProperties();
          if (!picked.length) { setState({ errorMsg: "물성을 하나 이상 선택해 주세요." }); return; }

          const materials = await withLoading("CMF 제안을 만들고 있습니다", async () => {
            const mk = extra => PROMPTS.MATERIAL(c || { nameKo: state.keyword, nameEn: "" }, picked, joinIns(instruction || "", extra));
            return fillToCount({ items: normMaterials(await callText(SYSTEM, mk(""))), target: 8, key: "materials",
              label: "CMF 안", titleOf: x => x.nameKo, norm: normMaterials, prompt: mk });
          });
          if (!materials) return;
          if (!materials.length) { setState({ errorMsg: "CMF 제안을 받지 못했습니다. 다시 시도해 주세요." }); return; }

          await Actions.clearImageSlots(["material"]);
          setState({
            materials,
            materialIds: [],
            images: Object.assign({}, state.images, { material: null }),
            step: 5
          }, true);
          persist(false);
          await Actions.generateMaterialImage();
        },
        async regenerateMaterials() {
          const ins = draft("ins-material").trim();
          drafts["ins-material"] = "";
          await Actions.generateMaterials(ins);
        },
        async generateMaterialImage() {
          if (!state.materials.length) return;
          const url = await withLoading("CMF 샘플 보드를 만들고 있습니다", () =>
            callImage(IMG.material(state.materials)));
          if (!url) return;
          await Actions.saveImage("material", url);
          render();
        }
      };
      window.Actions = Actions;

      function selectBar(picked, total, onAll) {
