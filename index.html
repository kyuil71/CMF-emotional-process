          </div>`;
      }

      function viewEmotion() {
        const chosen = selectedConcept();
        const cards = state.concepts.map((c, i) => optionCard({
          index: i + 1,
          selected: state.conceptIds.includes(c.id),
          title: c.nameKo,
          subtitle: c.nameEn,
          onclick: `Actions.toggleConcept('${escAttr(c.id)}')`,
          body: `
            <p class="t-small text-slate-700 prose-ko">${esc(c.definition)}</p>
            ${c.experience ? `<p class="t-small text-slate-600 prose-ko border-t border-slate-100 pt-3 mt-3">${esc(c.experience)}</p>` : ""}
            ${c.subject ? `<p class="t-meta text-slate-500">대표 장면 · ${esc(c.subject)}</p>` : ""}
            ${c.moodWords.length ? `<div class="flex flex-wrap gap-1.5 pt-1">${c.moodWords.map(w => chip(w, state.conceptIds.includes(c.id) ? "blue" : "")).join("")}</div>` : ""}`
        })).join("");

        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("감성 해석", 1)}
          ${sectionTitle("같은 감성을 세 가지 경험으로 해석했습니다", "각 안은 같은 감성 패밀리를 유지하면서 에너지·움직임, 분위기·공간, 감각·여운의 초점을 달리합니다. 이어서 발전시킬 해석을 하나 이상 골라 주세요. 여러 개를 고르면 하나로 통합해 다음 단계로 넘어갑니다.")}
          ${priorChoice([
            { label: "감성 키워드", value: state.keyword },
            { label: "연관 과제", value: state.note },
            { label: `선택한 감성 해석 ${state.conceptIds.length}개`, value: chosen ? `${chosen.nameKo} (${chosen.nameEn})` : "" }
          ])}

          ${imageCard("emotion", {
            title: "감성 해석 통합 이미지",
            alt: "세 가지 감성 해석의 대표 이미지",
            empty: "감성 해석 이미지를 아직 만들지 않았습니다.",
            onGenerate: "Actions.generateEmotionImage()",
            hideActions: true
          })}

          ${selectBar(state.conceptIds.length, state.concepts.length, "Actions.selectAllConcepts()")}

          <div class="space-y-3">${cards}</div>
          ${instructionBox("emotion", "예: 더 조용하고 내밀한 분위기로, 건축이나 인테리어 장면으로 바꿔 주세요")}

          ${dock(`
            ${chosen ? `<p class="t-meta text-slate-600 mb-3 truncate">선택한 해석 ${state.conceptIds.length}개 · ${esc(chosen.nameKo)}</p>` : ""}
            ${primaryBtn(chosen ? "지각 특성 분석" : "감성 해석을 하나 이상 선택하세요", "Actions.generatePerceptions()", !chosen)}
          `)}
        </div>`;
      }

      /* ---- 3단계 : 지각 특성 ---- */
      function viewPerception() {
        const picked = state.perceptionIds.length;
        const allOn = picked > 0 && picked === state.perceptions.length;
        const cards = state.perceptions.map((p, i) => optionCard({
          index: i + 1,
          selected: state.perceptionIds.includes(p.id),
          title: p.titleKo,
          subtitle: p.titleEn,
          badge: p.category,
          onclick: `Actions.togglePerception('${escAttr(p.id)}')`,
          body: `
            <p class="t-small text-slate-700 prose-ko">${esc(p.description)}</p>
            ${p.cue ? `<p class="t-meta text-slate-500 prose-ko">관찰 단서 · ${esc(p.cue)}</p>` : ""}`
        })).join("");

        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("지각 특성", 2)}
          ${sectionTitle("어떻게 지각되는가", "선택한 감성을 눈·손·몸으로 인식하는 서로 다른 10개의 지각 축으로 구조화했습니다. 물성으로 발전시킬 요소를 선택해 주세요.")}
          ${(function () {
            const c = selectedConcept();
            return priorChoice([
              { label: "감성 키워드", value: state.keyword },
              { label: "선택한 감성 해석", value: c ? `${c.nameKo} (${c.nameEn})` : "" }
            ]);
          })()}

          ${imageCard("perception", {
            title: "지각 특성 통합 이미지",
            alt: "지각 요소별 대표 이미지",
            empty: "지각 특성 이미지를 아직 만들지 않았습니다.",
            onGenerate: "Actions.generatePerceptionImage()"
          })}

          <div class="flex items-center justify-between gap-2 mb-3 px-1">
            <span class="t-meta font-bold text-slate-600">${picked}개 선택됨</span>
            ${ghostBtn(allOn ? "전체 해제" : "전체 선택", "Actions.selectAllPerceptions()", allOn ? "square" : "check-square")}
          </div>

          <div class="space-y-3">${cards}</div>
          ${instructionBox("perception", "예: 자연 이미지 반복을 줄이고 접촉 반응·공간 깊이·시간적 회복이 더 분명하도록 다시 구성해 주세요")}

          ${dock(primaryBtn(picked ? "물성 정의하기" : "지각 요소를 선택해 주세요", "Actions.generateProperties()", !picked))}
        </div>`;
      }

      /* ---- 4단계 : 물성 정의 ---- */
      /* LOW ─●─ HIGH : 값의 위치를 점으로 분명히 찍습니다. */
      function levelBar(value, on) {
        const pct = Math.max(2, Math.min(98, Number(value) || 55));
        const dot = on ? "bg-blue-700 ring-blue-700/20" : "bg-slate-900 ring-slate-900/15";
        return `<div class="flex items-center gap-2.5 pt-2 pb-1">
          <span class="t-meta text-slate-400 flex-shrink-0 tabular-nums">LOW</span>
          <div class="relative flex-1 h-5 flex items-center">
            <div class="h-[3px] w-full bg-slate-200 rounded-full"></div>
            <span class="absolute top-1/2 w-4 h-4 rounded-full ring-4 ${dot}" style="left:${pct}%;transform:translate(-50%,-50%)"></span>
          </div>
          <span class="t-meta text-slate-400 flex-shrink-0 tabular-nums">HIGH</span>
        </div>`;
      }

      function viewProperty() {
        const picked = state.propertyIds.length;
        const allOn = picked > 0 && picked === state.properties.length;
        const cards = state.properties.map((p, i) => optionCard({
          index: i + 1,
          selected: state.propertyIds.includes(p.id),
          title: p.titleKo,
          subtitle: p.titleEn,
          badge: p.axis,
          onclick: `Actions.toggleProperty('${escAttr(p.id)}')`,
          body: `
            <p class="t-small text-slate-700 prose-ko">${esc(p.description)}</p>
            ${p.check ? `<p class="t-meta text-slate-500 prose-ko">확인 방법 · ${esc(p.check)}</p>` : ""}
            ${levelBar(p.value, state.propertyIds.includes(p.id))}
            <p class="t-meta text-slate-500">목표 수준 · ${esc(p.level)} (${esc(p.value)})</p>`
        })).join("");

        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("물성 정의", 3)}
          ${sectionTitle("어떤 물성이 필요한가", "소재 이름 대신 관찰하고 확인할 수 있는 성질로 적었습니다. 필요한 물성을 여러 개 고를 수 있습니다.")}
          ${(function () {
            const c = selectedConcept();
            const ps = selectedPerceptions();
            return priorChoice([
              { label: "감성 키워드", value: state.keyword },
              { label: "선택한 감성 해석", value: c ? `${c.nameKo} (${c.nameEn})` : "" },
              { label: `선택한 지각 요소 ${ps.length}개`, value: joinTitles(ps, "titleKo") }
            ]);
          })()}

          ${imageCard("property", {
            title: "물성 통합 이미지",
            alt: "물성별 대표 표면·광학·촉감 이미지 통합 보드",
            empty: "물성 통합 이미지를 아직 만들지 않았습니다.",
            onGenerate: "Actions.generatePropertyImage()"
          })}

          <div class="flex items-center justify-between gap-2 mb-3 px-1">
            <span class="t-meta font-bold text-slate-600">${picked}개 선택됨</span>
            ${ghostBtn(allOn ? "전체 해제" : "전체 선택", "Actions.selectAllProperties()", allOn ? "square" : "check-square")}
          </div>

          <div class="space-y-3">${cards}</div>
          ${instructionBox("property", "예: 빛의 반응과 표면 기복을 더 세분화해 주세요")}

          ${dock(primaryBtn(picked ? "CMF 제안 받기" : "물성을 선택해 주세요", "Actions.generateMaterials()", !picked))}
        </div>`;
      }

      /* ---- 5단계 : 소재 제안 ---- */
      /* 소재 규격 · 가공기법 · 마감 · 효과를 한 덩어리로 보여 줍니다. */
      function specBlock(m) {
        const line = (k, v) => v ? `<div class="pt-1.5">
          <span class="t-meta font-bold text-slate-800">→ ${esc(k)}: </span>
          <span class="t-small text-slate-700">${esc(v)}</span>
        </div>` : "";
        if (!(m.base || m.process || m.finish || m.effect)) return "";
        return `<section class="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-4 mt-1">
          ${m.base ? `<p class="t-h3 text-slate-900 leading-snug mb-1">${esc(m.base)}</p>` : ""}
          ${line("Process", m.process)}
          ${line("Finish", m.finish)}
          ${line("Effect", m.effect)}
        </section>`;
      }

      function materialCard(m, i) {
        const composite = m.type === "복합 소재";
        const on = state.materialIds.includes(m.id);
        const row = (label, value) => `<div class="pt-3">
          <p class="t-meta font-bold text-slate-500 mb-0.5">${esc(label)}</p>
          <p class="t-small text-slate-700 prose-ko">${esc(value)}</p>
        </div>`;
        return `<article class="w-full p-5 rounded-[2rem] border-2 bg-white transition-all ${on ? "border-blue-700 shadow-lg ring-2 ring-blue-700/15" : "border-slate-200 shadow-md"}">
          <button type="button" onclick="Actions.toggleMaterial('${escAttr(m.id)}')" aria-pressed="${on}" class="w-full text-left flex items-start gap-3 mb-2">
            <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 font-bold t-meta tabular-nums ${on ? "bg-blue-700 text-white" : "bg-slate-200 text-slate-700"}">${on ? '<i data-lucide="check" class="w-5 h-5"></i>' : pad2(i + 1)}</span>
            <span class="min-w-0 flex-1 block">
              <span class="block t-h3 text-slate-900 leading-snug font-bold">${esc(m.nameKo)}</span>
              <span class="block t-meta text-slate-500">${esc(m.nameEn)}</span>
              <span class="inline-block mt-1.5 t-meta font-bold px-2.5 py-1 rounded-lg ${composite ? "bg-blue-100 text-blue-800" : "bg-slate-200 text-slate-700"}">${esc(m.type)}</span>
            </span>
          </button>
          <div>
            ${specBlock(m)}
            ${row("구성", m.composition)}
            ${row("특징", m.character)}
            ${row("물성 구현 방식", m.howTo)}
            ${row("한계", m.limit)}
            ${m.colorNote ? `<div class="flex flex-wrap gap-1.5 pt-3">${chip(m.colorNote)}</div>` : ""}
          </div>
        </article>`;
      }

      function viewMaterial() {
        const cards = state.materials.map((m, i) => materialCard(m, i)).join("");
        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("CMF 제안", 4)}
          ${sectionTitle("어떻게 구현할 것인가", "선택한 물성을 표현할 수 있는 단일 소재와 복합 소재의 CMF 안입니다. 하나만 또는 전체를 골라 시뮬레이터 프롬프트와 리포트에 반영할 수 있습니다.")}
          ${(function () {
            const c = selectedConcept();
            const ps = selectedPerceptions();
            const qs = selectedProperties();
            return priorChoice([
              { label: "선택한 감성 해석", value: c ? `${c.nameKo} (${c.nameEn})` : "" },
              { label: `선택한 지각 요소 ${ps.length}개`, value: joinTitles(ps, "titleKo") },
              { label: `선택한 물성 ${qs.length}개`, value: qs.map((q, i) => `${pad2(i + 1)} ${q.titleKo} ${q.value}`).join("   ") }
            ]);
          })()}

          ${imageCard("material", {
            title: "CMF 샘플 보드",
            alt: "CMF별 단일 에디토리얼 샘플 이미지 보드",
            empty: "CMF 샘플 보드를 아직 만들지 않았습니다.",
            onGenerate: "Actions.generateMaterialImage()"
          })}

          ${selectBar(state.materialIds.length, state.materials.length, "Actions.selectAllMaterials()")}

          <div class="space-y-3">${cards}</div>
          ${instructionBox("material", "예: 재활용 소재로 바꾸고 표면 질감을 더 거칠게 해 주세요")}

          ${dock(`
            <div class="space-y-2.5">
              ${primaryBtn("전체 리포트 PDF로 저장", "Actions.exportPdf()")}
              ${secondaryBtn("시뮬레이터 제작 프롬프트 만들기", "Actions.openSimPrompt()", "code-xml")}
            </div>
          `)}
        </div>`;
      }

      /* =========================================================
         16. 오버레이 — 로딩 / 오류 / 이미지 확대
         ========================================================= */
      function overlays() {
        let html = "";

        if (state.isAnalyzing) {
          html += `<div class="fixed inset-0 z-[10000] bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center px-8 text-center max-w-[430px] mx-auto animate-fade-in" role="status" aria-live="polite">
            <div class="spinner-ring mb-8" role="presentation"></div>
            <h2 class="t-h2 text-slate-900 mb-2">${esc(state.loadingMsg)}</h2>
            <p class="t-small text-slate-600 mb-8">1분 넘게 걸릴 수 있습니다</p>
            <p class="t-small font-bold text-slate-800 text-center mb-4 prose-ko" style="text-align:center">처리 중에는 화면을 켜 두고 다른 앱으로 전환하지 마세요.</p>
            <button type="button" onclick="Actions.cancel()" class="px-7 py-3.5 rounded-2xl border-2 border-slate-300 text-slate-700 font-bold t-small hover:bg-slate-50 active:scale-95 transition-all">취소</button>
          </div>`;
        }

        if (state.lightbox && state.images && state.images[state.lightbox]) {
          html += `<div class="fixed inset-0 z-[10001] bg-black/90 flex flex-col max-w-[430px] mx-auto" role="dialog" aria-modal="true" aria-label="이미지 크게 보기">
            <div class="flex justify-end p-3">
              <button type="button" onclick="Actions.closeLightbox()" aria-label="닫기" class="p-3 rounded-full bg-white/10 text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="flex-1 overflow-auto px-3 pb-6 no-scrollbar">
              <img src="${escAttr(state.images[state.lightbox])}" alt="확대한 통합 이미지" class="w-full rounded-2xl" />
            </div>
          </div>`;
        }

        if (state.simPrompt) {
          html += `<div class="fixed inset-0 z-[10001] bg-black/60 backdrop-blur-sm flex items-end justify-center max-w-[430px] mx-auto" role="dialog" aria-modal="true" aria-labelledby="sim-title">
            <div class="bg-white w-full rounded-t-[2rem] p-5 pb-[calc(20px+env(safe-area-inset-bottom))] max-h-[92vh] flex flex-col animate-fade-in">
              <div class="flex items-start justify-between gap-3 mb-2">
                <h2 id="sim-title" class="t-h2 text-slate-900">시뮬레이터 제작 프롬프트</h2>
                <button type="button" onclick="Actions.closeSimPrompt()" aria-label="닫기" class="p-2.5 rounded-full hover:bg-slate-100 flex-shrink-0"><i data-lucide="x" class="w-6 h-6"></i></button>
              </div>
              <p class="t-meta text-slate-600 mb-3 prose-ko">${state.materialIds.length ? `선택한 CMF 안 ${state.materialIds.length}개` : `최종 CMF 안 ${state.materials.length}개 전체`}를 3D 큐브로 비교하는 단일 HTML 시뮬레이터를 만들게 하는 프롬프트입니다. 복사해서 Claude 같은 AI에 붙여 넣고, 아래에서 저장한 CMF 샘플 보드 이미지도 함께 첨부하세요.${state.images.material ? "" : " (샘플 보드 이미지가 아직 없습니다. 보드를 먼저 생성하면 더 정확한 시뮬레이터를 만들 수 있습니다.)"}</p>
              <label for="sim-prompt-text" class="sr-only">시뮬레이터 제작 프롬프트</label>
              <textarea id="sim-prompt-text" readonly class="flex-1 min-h-[36vh] w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl t-meta text-slate-800 resize-none outline-none focus:border-blue-700">${esc(state.simPrompt)}</textarea>
              <div class="space-y-2.5 mt-4">
                ${primaryBtn("프롬프트 복사", "Actions.copySimPrompt()")}
                ${secondaryBtn("텍스트 파일로 저장", "Actions.downloadSimPrompt()", "download")}
                ${state.images.material ? secondaryBtn("CMF 샘플 보드 이미지 저장", "Actions.downloadImage('material')", "image") : ""}
              </div>
            </div>
          </div>`;
        }

        if (state.errorMsg) {
          html += `<div class="fixed inset-0 z-[10002] flex items-center justify-center bg-black/50 px-6 backdrop-blur-sm" role="alertdialog" aria-modal="true" aria-labelledby="err-title">
            <div class="bg-white p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl animate-scale-in">
              <i data-lucide="alert-triangle" class="text-red-600 mx-auto mb-4 w-12 h-12"></i>
              <h2 id="err-title" class="t-h3 text-slate-900 mb-6 prose-ko">${esc(state.errorMsg)}</h2>
              <button type="button" onclick="setState({errorMsg:null})" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold t-small">확인</button>
            </div>
          </div>`;
        }
        return html;
      }

      /* =========================================================
         17. 메인 렌더 — 예외가 나도 화면이 멈추지 않도록 방어
         ========================================================= */
      function captureUI() {
        const el = document.activeElement;
        const f = (el && el.id && (el.tagName === "INPUT" || el.tagName === "TEXTAREA"))
          ? { id: el.id, start: el.selectionStart, end: el.selectionEnd } : null;
        return { focus: f, scrollY: window.scrollY };
      }
      function restoreUI(snap, resetScroll) {
        if (snap.focus) {
          const el = document.getElementById(snap.focus.id);
          if (el) {
            el.focus({ preventScroll: true });
            try { el.setSelectionRange(snap.focus.start, snap.focus.end); } catch (e) { /* range 미지원 */ }
          }
        }
        window.scrollTo(0, resetScroll ? 0 : snap.scrollY);
      }

      function fallback(backStep, msg) {
        return `<div class="page-top px-6 min-h-screen">
          <div class="bg-white border-2 border-slate-300 rounded-3xl p-8 text-center shadow-md">
            <i data-lucide="compass" class="w-12 h-12 text-slate-500 mx-auto mb-4"></i>
            <h2 class="t-h3 text-slate-900 mb-2">${esc(msg)}</h2>
            <p class="t-small text-slate-600 mb-6">이전 단계로 돌아가 다시 실행해 주세요.</p>
            ${primaryBtn("이전 단계로", `setState({step:${backStep}}, true)`)}
          </div>
        </div>`;
      }

      function body() {
        switch (state.step) {
          case -1: return viewAuth();
          case 0:  return viewHome();
          case 1:  return viewKeyword();
          case 2:  return state.concepts.length ? viewEmotion() : fallback(1, "생성된 감성 해석이 없습니다.");
          case 3:  return state.perceptions.length ? viewPerception() : fallback(2, "분석된 지각 특성이 없습니다.");
          case 4:  return state.properties.length ? viewProperty() : fallback(3, "정의된 물성이 없습니다.");
          case 5:  return state.materials.length ? viewMaterial() : fallback(4, "제안된 CMF가 없습니다.");
          default: return fallback(0, "요청한 화면을 찾을 수 없습니다.");
        }
      }

      function render(resetScroll) {
        const root = document.getElementById("root");
        const snap = captureUI();
        const shell = "w-full max-w-[430px] mx-auto bg-slate-100 min-h-screen relative overflow-x-hidden shadow-2xl";
        let inner;
        try {
          inner = body();
        } catch (err) {
          console.error("render 실패:", err);
          inner = fallback(0, "화면을 그리는 중 문제가 발생했습니다.");
        }
        try {
          root.innerHTML = `<div class="${shell}">${inner}${overlays()}</div>`;
          if (window.lucide && typeof lucide.createIcons === "function") lucide.createIcons();
        } catch (err) {
          console.error("DOM 갱신 실패:", err);
          root.innerHTML = `<div class="${shell}"><div class="p-8 t-body">화면을 표시할 수 없습니다. 새로고침해 주세요.</div></div>`;
        }
        restoreUI(snap, resetScroll);
      }

      /* =========================================================
         18. 부팅
         ========================================================= */
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (state.errorMsg) setState({ errorMsg: null });
        else if (state.simPrompt) Actions.closeSimPrompt();
        else if (state.lightbox) Actions.closeLightbox();
        else if (state.isAnalyzing) Actions.cancel();
      });

      /* 자동 저장 — 내용이 바뀐 경우에만 기록합니다. 모바일은 앱 전환·종료 때 beforeunload가 오지 않으므로
         화면이 가려지는 순간(visibilitychange / pagehide)에도 저장합니다. */
      const safePersist = () => { try { persist(false); } catch (e) { console.warn("자동 저장 실패", e); } };
      setInterval(safePersist, CONFIG.AUTOSAVE_MS);
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") safePersist(); });
      window.addEventListener("pagehide", safePersist);
      window.addEventListener("beforeunload", safePersist);

      loadSession();
      if (state.apiKey) state.step = 0;
      Store.init().catch(e => console.warn("저장 목록을 불러오지 못했습니다.", e)).then(() => render(true));
    })();
  </script>
</body>
</html>
